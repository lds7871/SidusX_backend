spring:
  application:
    name: GHstart
  config:
    import: classpath:config.properties
  session:
    store-type: memory
    timeout: 1800  # 30 分钟
    cookie:
      http-only: true
      max-age: 1800 
      name: JSESSIONID
      path: /
      secure: false
  datasource:
    # 如果 PostgreSQL 服务要求 SSL 连接，请在 JDBC URL 中开启 ssl
    # "no encryption" 错误通常表示服务器要求加密连接（hostssl），客户端未使用 SSL
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 375279901
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: LDS.Person.entity,LDS.Person.dto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    use-generated-keys: true
    default-executor-type: REUSE
    default-statement-timeout: 30

server:
  port: 8100
  servlet:
    context-path: /

# 安全配置
security:
  # IP白名单配置 - 只允许本地和指定IP访问
  ip-whitelist-enabled: true  # 是否启用IP白名单过滤，生产环境建议设置为 true
  # IP白名单列表 - 允许访问的IP地址
  ip-whitelist:
    - "127.0.0.1" # 本地回环地址
    - "::1" # IPv6本地回环地址
    - "localhost" # 本地主机名
    - "0:0:0:0:0:0:0:1" # 另一种IPv6本地回环地址
    - "115.190.170.56" # 我的服务器公网IP地址
    - "117.93.25.55" # 家

  # Pass Token配置 - 通过令牌绕过IP白名单限制
  pass-token-enabled: true  # 是否启用pass_token功能，生产环境建议设置为 true
  # 例如：export PASS_TOKENS="token1,token2,token3"
  pass-tokens: ${PASS_TOKENS}


logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    LDS.Person: DEBUG
    org.springframework.web: WARN                    # 改为 WARN，屏蔽 DEBUG 级别的日志
    org.springframework.web.servlet.DispatcherServlet: WARN  # 屏蔽 DispatcherServlet 的 DEBUG 日志
    org.springframework.web.servlet.handler: WARN   # 屏蔽路由处理器的 DEBUG 日志
    org.apache.coyote: WARN                         # 屏蔽 Tomcat HTTP 解析错误日志
    org.apache.coyote.http11: WARN                  # 屏蔽 HTTP/1.1 处理器的日志
    org.apache.tomcat: WARN                         # 屏蔽 Tomcat 的 DEBUG 日志
    org.hibernate.SQL: DEBUG
    org.mybatis: DEBUG

# SpringDoc OpenAPI (Swagger) 配置
springdoc:
  api-docs:
    enabled: false      # 禁用 API 文档
  swagger-ui:
    enabled: false      # 禁用 Swagger UI

# WebSocket 控制台输出配置
websocket:
  console:
    enabled: true                    # 是否启用WebSocket控制台输出
    endpoint: /ws/console            # WebSocket端点路径
    password: ${PASS_TOKENS}                 # 连接密码
    max-text-message-buffer-size: 512000  # 最大文本消息缓冲区大小（字节）
    max-binary-message-buffer-size: 512000 # 最大二进制消息缓冲区大小（字节）
    max-session-idle-timeout: 300000      # 会话空闲超时时间（毫秒，5分钟）
    message-queue-size: 1000              # 消息队列大小
    history-buffer-size: 100              # 历史消息缓存数量
























































